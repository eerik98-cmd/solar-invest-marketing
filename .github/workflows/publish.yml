name: Publish site

# Gombnyomásra fut: GitHub → Actions → "Publish site" → Run workflow
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Csak szimuláció, nem tölt fel semmit"
        type: boolean
        default: true

concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Ha az "production" environmentben required reviewert állítasz be, jóváhagyás után fut.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Stage site files (csak a publikus oldal)
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/stage" && mkdir -p "$RUNNER_TEMP/stage"
          rsync -a \
            --exclude='.git' --exclude='.git/***' \
            --exclude='.github/***' \
            --exclude='README.md' --exclude='CLAUDE.md' \
            ./ "$RUNNER_TEMP/stage/"
          # Biztonsági ellenőrzés: ezek soha nem kerülhetnek a szerverre
          for bad in .git .github README.md CLAUDE.md; do
            if [ -e "$RUNNER_TEMP/stage/$bad" ]; then echo "HIBA: $bad a staging mappában"; exit 1; fi
          done
          echo "Staging fájlok: $(find "$RUNNER_TEMP/stage" -type f | wc -l)"

      - name: Deploy via FTPS
        env:
          FTP_HOST: ftp.solar-invest.ro
          FTP_DIR: /public_html/casa-verde-2026
          FTP_USER: ${{ vars.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          for v in FTP_USER FTP_PASSWORD; do
            if [ -z "${!v}" ]; then echo "Hiányzik: $v (FTP_USER = Variable, FTP_PASSWORD = Secret)"; exit 1; fi
          done

          MIRROR_OPTS="--reverse --verbose --parallel=4"
          if [ "$DRY_RUN" = "true" ]; then MIRROR_OPTS="$MIRROR_OPTS --dry-run"; fi

          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<EOF
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ssl:verify-certificate yes
          set net:max-retries 3
          set net:timeout 20
          mirror $MIRROR_OPTS "$RUNNER_TEMP/stage" "$FTP_DIR"
          bye
          EOF

      - name: Summary
        run: |
          echo "### Publikálás kész" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dry run: \`${{ inputs.dry_run }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
